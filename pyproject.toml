[project]
name = "tcn-refactor"
version = "0.1.0"
description = "Streaming causal TCN for gas-sensor response acceleration and compensation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "torch>=2.3",
]

[tool.setuptools.packages.find]
include = ["tcn_union*"]

[tool.ruff.lint]
extend-select = [
    "I",  # Import-related rules
    "UP",
    "NPY",
]
